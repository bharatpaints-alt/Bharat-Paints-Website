<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bharat Paints — Paint Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --saffron:#E8541A; --saffron2:#B83E0E; --saffron-light:#FDF0EB;
  --green:#1A6B3C; --navy:#1A2340; --gold:#C9891A;
  --cream:#FFFDF9; --gray:#6B7280; --border:#E5E7EB;
  --wa:#25D366; --white:#fff;
  --shadow:0 4px 24px rgba(26,35,64,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#FFF7F3 0%,#F0F7F3 60%,#FFF7F3 100%);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}

/* ── HEADER ── */
.header{
  width:100%; background:var(--navy);
  padding:12px 18px; display:flex; align-items:center; gap:12px;
  box-shadow:0 2px 12px rgba(26,35,64,.22); position:sticky; top:0; z-index:100;
}
.logo-box{
  width:46px;height:46px;border-radius:12px;background:white;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.2);
}
.logo-box img{width:100%;height:100%;object-fit:contain;}
.logo-box .logo-fallback{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;
  color:var(--saffron);display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
}
.hd-text h1{font-size:16px;font-weight:700;color:white;line-height:1.2;}
.hd-text p{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px;}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.online-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.online-txt{font-size:11px;color:rgba(255,255,255,.8);}
.wa-header-btn{
  background:var(--wa);color:white;font-size:11.5px;font-weight:600;
  padding:6px 12px;border-radius:20px;text-decoration:none;
  display:flex;align-items:center;gap:5px;
  box-shadow:0 2px 8px rgba(37,211,102,.3);
  white-space:nowrap;
}
.wa-header-btn:hover{filter:brightness(1.08);}

/* ── MESSAGES ── */
.chat-wrap{width:100%;max-width:700px;flex:1;padding:0 0 130px;}
.messages{padding:18px 14px 0;display:flex;flex-direction:column;gap:14px;}
.msg{display:flex;gap:10px;align-items:flex-end;}
.msg.bot{flex-direction:row;}
.msg.user{flex-direction:row-reverse;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:14px;
  flex-shrink:0;color:white;font-weight:700;
}
.bubble{max-width:82%;padding:11px 15px;line-height:1.58;font-size:14px;border-radius:16px;}
.msg.bot .bubble{
  background:white;color:var(--navy);border-bottom-left-radius:4px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--saffron),var(--saffron2));
  color:white;border-bottom-right-radius:4px;
  box-shadow:0 4px 16px rgba(232,84,26,.25);
}
.bubble ul{padding-left:18px;margin-top:5px;}
.bubble ul li{margin-bottom:3px;}
.bubble strong{font-weight:600;}
.bubble .tag{
  display:inline-block;background:var(--saffron-light);color:var(--saffron2);
  font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:6px;
}
.wa-btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  background:var(--wa);color:white;font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:8px;text-decoration:none;
}

/* price table */
.price-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
.price-table th{background:var(--navy);color:white;padding:6px 10px;text-align:left;}
.price-table td{padding:5px 10px;border-bottom:1px solid var(--border);}
.price-table tr:nth-child(even) td{background:#f8fafc;}
.price-more{font-size:12px;color:var(--gray);margin-top:5px;}

/* typing */
.typing{display:flex;gap:5px;padding:10px 14px;align-items:center;}
.typing span{width:7px;height:7px;background:var(--gray);border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* chips */
.chips-wrap{padding:10px 14px 4px;display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:white;border:1.5px solid var(--saffron);color:var(--saffron2);
  font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:30px;cursor:pointer;
  transition:all .17s;font-family:'Poppins',sans-serif;
}
.chip:hover{background:var(--saffron);color:white;}

/* input */
.input-area{
  position:fixed;bottom:0;left:0;right:0;background:white;
  border-top:1px solid var(--border);padding:10px 14px 14px;
  display:flex;gap:9px;align-items:center;
  box-shadow:0 -4px 24px rgba(26,35,64,.08);
}
.input-area input{
  flex:1;padding:11px 16px;border:1.5px solid var(--border);border-radius:30px;
  font-family:'Poppins',sans-serif;font-size:14px;color:var(--navy);
  outline:none;background:#F3F4F6;transition:border-color .18s;
}
.input-area input:focus{border-color:var(--saffron);background:white;}
.input-area input::placeholder{color:var(--gray);}
.send-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--saffron),var(--saffron2));
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 14px rgba(232,84,26,.35);transition:transform .15s;flex-shrink:0;
}
.send-btn:hover{transform:scale(1.07);}
.send-btn svg{width:19px;height:19px;fill:white;}

/* admin panel */
.admin-toggle{
  position:fixed;bottom:70px;right:14px;
  background:var(--navy);color:white;font-size:11px;font-weight:600;
  padding:6px 12px;border-radius:20px;cursor:pointer;z-index:200;
  box-shadow:0 2px 10px rgba(26,35,64,.3);border:none;font-family:'Poppins',sans-serif;
}
.admin-panel{
  display:none;position:fixed;bottom:120px;right:14px;
  background:white;border-radius:14px;padding:16px;width:310px;
  box-shadow:0 8px 32px rgba(26,35,64,.18);border:1px solid var(--border);
  z-index:200;max-height:60vh;overflow-y:auto;
}
.admin-panel h3{font-size:13px;color:var(--navy);margin-bottom:10px;}
.admin-panel .query-item{
  background:#FFF7F3;border:1px solid #FDE0D0;border-radius:8px;
  padding:7px 10px;font-size:12px;color:var(--navy);margin-bottom:6px;
}
.admin-panel .query-count{
  font-size:11px;color:var(--gray);margin-top:2px;
}
.admin-panel .empty-msg{font-size:12px;color:var(--gray);text-align:center;padding:10px 0;}
.clear-btn{
  width:100%;background:#FDF0EB;border:1px solid var(--saffron);
  color:var(--saffron2);font-size:12px;font-weight:600;
  padding:7px;border-radius:8px;cursor:pointer;margin-top:8px;
  font-family:'Poppins',sans-serif;
}

/* footer */
.shop-footer{
  width:100%;background:var(--navy);text-align:center;
  padding:7px 14px;font-size:10.5px;color:rgba(255,255,255,.7);
  position:fixed;bottom:0;left:0;z-index:50;pointer-events:none;
}

#msgEnd{height:1px;}
@media(max-width:500px){
  .bubble{font-size:13.5px;}
  .chip{font-size:12px;padding:5px 11px;}
  .wa-header-btn span{display:none;}
}
</style>
</head>

function normaliseQuery(raw) {
  let q = raw.toLowerCase().trim();
  // Remove punctuation except spaces and digits
  q = q.replace(/[^\w\s₹]/g, ' ');
  // Remove query noise words that cause false fuzzy matches
  q = q.replace(/\b(price|prices|rate|rates|cost|show|tell|give|what|best|good|any|ka|ki|ke|kya|bata|btao|chahiye|hai|hain)\b/g, ' ');
  // Collapse multiple spaces
  q = q.replace(/\s+/g, ' ').trim();
  // Apply spell map (longest match wins — sort by length desc)
  const keys = Object.keys(SPELL_MAP).sort((a,b) => b.length - a.length);
  for (const k of keys) {
    if (q.includes(k)) {
      q = q.split(k).join(SPELL_MAP[k]);
    }
  }
  return q;
}

// Runs once at startup. For every product name, generates
// normalised tokens + common abbreviation forms automatically.
// No manual keyword lists needed.
let PRICE_INDEX = []; // [{p, tokens, brand, category, useCase, quality}]

function buildPriceIndex() {
  const stopWords = new Set(['the','and','for','with','per','kg','lt','ltr','no','pcs','mt','roll','advance','price','prices','rate','rates','cost','show','tell','give','what','best','good','any']);

  function indexProduct(p) {
    const raw = p.n.toLowerCase();
    // Tokenise product name
    const nameTokens = raw
      .replace(/[^\w\s]/g,' ')
      .split(/\s+/)
      .filter(w => w.length > 1 && !stopWords.has(w));

    // Also tokenise useCase, category, quality for priority matching
    const useCaseTokens = (p.useCase||'').toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>1);
    const catTokens     = (p.category||'').toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>1);
    const qualTokens    = (p.quality||'').toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>1);
    const brandTokens   = (p.brand||'').toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>1);

    // Combined token set for fuzzy matching (all fields)
    const allTokens = [...new Set([...useCaseTokens,...catTokens,...qualTokens,...brandTokens,...nameTokens])];
    const condensed = nameTokens.join('');

    return { p, tokens:allTokens, nameTokens, useCaseTokens, catTokens, qualTokens, brandTokens, condensed,
             raw, useCase:(p.useCase||'').toLowerCase(), category:(p.category||'').toLowerCase(),
             quality:(p.quality||'').toLowerCase(), brand:(p.brand||'').toLowerCase() };
  }

  // SHEET_PRICES take priority — deduplicate by product name
  const sheetNames = new Set(SHEET_PRICES.map(p => p.n));
  const sheetEntries     = SHEET_PRICES.map(indexProduct);
  const hardcodedEntries = PRICES.filter(p => !sheetNames.has(p.n)).map(indexProduct);

  PRICE_INDEX = [...sheetEntries, ...hardcodedEntries];
  console.log(`[BP Search] Index built — Sheet: ${sheetEntries.length}, Hardcoded: ${hardcodedEntries.length}, Total: ${PRICE_INDEX.length}`);
}

// ── STEP 3: LEVENSHTEIN DISTANCE ─────────────────────────────
// Pure-JS fuzzy distance. Used to match typos in individual words.
function levenshtein(a, b) {
  if (a === b) return 0;
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const dp = Array.from({length: a.length+1}, (_,i) =>
    Array.from({length: b.length+1}, (_,j) => i===0 ? j : j===0 ? i : 0)
  );
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}

// Fuzzy token match: returns similarity 0..1
function tokenSim(qWord, indexWord) {
  if (indexWord.includes(qWord)) return 1.0;          // substring hit
  if (qWord.length <= 3) return qWord === indexWord ? 1 : 0; // short words: exact only
  const dist = levenshtein(qWord, indexWord);
  const maxLen = Math.max(qWord.length, indexWord.length);
  return Math.max(0, 1 - dist / maxLen);
}

// ── STEP 4: SCORE A SINGLE PRODUCT ───────────────────────────
// Returns a numeric score and a reason string for console logging.
const SIM_THRESHOLD = 0.72; // min similarity to count as a match

function scoreProduct(entry, queryTokens) {
  let score = 0;
  const reasons = [];

  for (const qt of queryTokens) {
    let best = 0;
    let bestTok = '';
    // Compare against every product token
    for (const pt of entry.tokens) {
      const s = tokenSim(qt, pt);
      if (s > best) { best = s; bestTok = pt; }
    }
    // Also check condensed alias (handles "walputy")
    const condensedSim = entry.condensed.includes(qt) ? 1.0 : 0;
    best = Math.max(best, condensedSim);

    if (best >= SIM_THRESHOLD) {
      // Weight: exact=3, near-exact=2, fuzzy=1
      const w = best === 1.0 ? 3 : best > 0.88 ? 2 : 1;
      score += w * best;
      reasons.push(`"${qt}"→"${bestTok}"(sim=${best.toFixed(2)},w=${w})`);
    }
  }

  // Priority bonuses
  const matchRatio = reasons.length / queryTokens.length;
  if (matchRatio === 1) { score += 5; reasons.push('ALL_TOKENS_MATCHED(+5)'); }
  else if (matchRatio >= 0.5) { score += 1; reasons.push('PARTIAL_MATCH(+1)'); }

  // Brand bonus: exact brand match in query gives strong boost
  const brandStr = entry.brand.toLowerCase();
  const brandBonus = queryTokens.some(qt => qt.length > 2 && (brandStr.includes(qt) || qt.includes(brandStr.split(' ')[0])));
  if (brandBonus) { score += 4; reasons.push('BRAND_MATCH(+4)'); }

  return { score, reasons };
}

// ── STEP 5: MAIN SEARCH FUNCTION ─────────────────────────────
// Search priority: useCase → category → quality → brand → name
// Never mixes products from different USE CASE groups
function searchPrices(rawQuery) {
  const norm  = normaliseQuery(rawQuery);
  const qToks = norm.split(/\s+/).filter(w => w.length > 1);
  console.log(`[BP Search] Query: "${rawQuery}" → normalised: "${norm}" → tokens: [${qToks.join(', ')}]`);

  if (qToks.length === 0) return { results:[], suggestions:[], confidence:'none' };

  // ── Phase 0: BRAND-ONLY DETECTION ────────────────────────────
  // Known brand names — if query matches one, hard-filter to that brand only
  const BRAND_ALIASES = {
    'gio':'gio', 'asian':'asian', 'dulux':'dulux', 'berger':'berger',
    'kupsa':'kupsa', 'drfixit':'dr. fixit', 'fixit':'dr. fixit',
    'zydex':'zydex', 'birla':'birla', 'nerolac':'nerolac',
    'appg':'asian paints ppg', 'shalimar':'shalimar', 'british':'british',
  };
  let brandFilter = null;
  for (const [alias, brandKey] of Object.entries(BRAND_ALIASES)) {
    if (qToks.includes(alias) || norm.includes(alias)) {
      brandFilter = brandKey;
      console.log(`[BP Search] Brand filter detected: "${alias}" → "${brandKey}"`);
      break;
    }
  }

  // If brand filter detected — return only that brand's products immediately
  if (brandFilter) {
    const brandResults = PRICE_INDEX
      .filter(e => e.brand.includes(brandFilter))
      .map(e => e.p);
    console.log(`[BP Search] Brand-only mode: "${brandFilter}" → ${brandResults.length} products`);
    if (brandResults.length > 0) {
      return { results: brandResults.slice(0,8), suggestions: brandResults.slice(0,3), confidence:'high' };
    }
    // Brand found in aliases but no products — fall through to normal search
  }

  // ── Category-only detection ─────────────────────────────────
  // When query is clearly about one category, hard-filter to that category
  const CAT_FILTER_MAP = {
    'interior emulsion': 'Interior Emulsion',
    'interior paint':    'Interior Emulsion',
    'exterior emulsion': 'Exterior Emulsion',
    'exterior paint':    'Exterior Emulsion',
    'enamel':            'Enamel Paints',
    'wall putty':        'Wall Putty',
    'putty':             'Wall Putty',
    'primer':            'Primers',
    'distemper':         'Distemper',
    'thinner':           'Thinners',
    'wood coating':      'Wood Coatings',
    'industrial paint':  'Industrial Paints',
    'white cement':      'White Cement',
    'exterior texture':  'Exterior Texture',
    'texture':           'Exterior Texture',
  };
  let catFilter = null;
  for (const [kw, catName] of Object.entries(CAT_FILTER_MAP)) {
    if (normFull.includes(kw)) {
      catFilter = catName;
      console.log(`[BP Search] Category filter: "${kw}" → "${catName}"`);
      break;
    }
  }
  if (catFilter && !brandFilter) {
    const catResults = PRICE_INDEX
      .filter(e => e.p.category === catFilter)
      .map(e => e.p);
    console.log(`[BP Search] Category-only mode: "${catFilter}" → ${catResults.length} products`);
    if (catResults.length > 0) {
      return { results: catResults.slice(0,8), suggestions: catResults.slice(0,3), confidence:'high' };
    }
  }

  // ── Waterproofing category filter ────────────────────────────
  // When customer asks for waterproofing prices, show only Zydex + Asian Paints.
  // Dr. Fixit shown only when customer explicitly asks for Dr. Fixit by name.
  const WP_TERMS = ['waterproof','waterproofing','seepage','damp','dampness','leak','terrace','rooftop','roof leak'];
  const isWpQuery = WP_TERMS.some(t => normFull.includes(t));
  const hasDrFixit = normFull.includes('fixit') || normFull.includes('dr fixit') || normFull.includes('fix it');
  if (isWpQuery && !hasDrFixit && !brandFilter) {
    const wpResults = PRICE_INDEX
      .filter(e => e.p.category === 'Waterproofing' && !e.brand.includes('dr. fixit') && !e.brand.includes('fixit'))
      .map(e => e.p);
    console.log(`[BP Search] Waterproofing filter (no Dr Fixit): ${wpResults.length} products`);
    if (wpResults.length > 0) {
      return { results: wpResults.slice(0,8), suggestions: wpResults.slice(0,3), confidence:'high' };
    }
  }

  // ── Phase 1: USE CASE DETECTION ──────────────────────────────
  const USE_CASE_MAP = {
    'interior walls':    'interior walls',   'bedroom':     'interior walls',
    'living room':       'interior walls',   'hall':        'interior walls',
    'interior':          'interior walls',   'interior wall':'interior walls',
    'exterior walls':    'exterior walls',   'exterior':    'exterior walls',
    'outside':           'exterior walls',   'outdoor':     'exterior walls',
    'damp':              'damp brick wall / plaster wall',
    'dampness':          'damp brick wall / plaster wall',
    'seepage':           'damp brick wall / plaster wall',
    'waterproof':        'damp brick wall / plaster wall',
    'waterproofing':     'damp brick wall / plaster wall',
    'rooftop':           'rooftop',          'roof':        'rooftop',
    'terrace':           'rooftop',
    'tile':              'roof top with tile /stone',
    'wood':              'wood, ply, hdhmr and mdf',
    'furniture':         'wood, ply, hdhmr and mdf',
    'ply':               'wood, ply, hdhmr and mdf',
    'mdf':               'wood, ply, hdhmr and mdf',
    'hdhmr':             'wood, ply, hdhmr and mdf',
    'cabinet':           'furniture manufacturers',
    'manufacturer':      'furniture manufacturers',
    'metal':             'metal structures',
    'gate':              'metal structures', 'grill':       'metal structures',
    'steel':             'metal structures',
    'rice mill':         'rice mills',       'mill':        'rice mills',
    'factory':           'rice mills',
    'project':           'project sites',    'site':        'project sites',
    'floor tiles':       'floor tiles /marble','marble':    'floor tiles /marble',
    'floor':             'floor tiles /marble',
    'enamel':            null,               'putty':       null,
    'primer':            null,               'thinner':     null,
    'distemper':         null,               'texture':     null,
  };

  let matchedUseCase = null;
  const normFull = norm.toLowerCase();
  for (const [kw, uc] of Object.entries(USE_CASE_MAP)) {
    if (normFull.includes(kw) && uc !== null) {
      matchedUseCase = uc;
      console.log(`[BP Search] USE CASE matched: "${kw}" → "${uc}"`);
      break;
    }
  }

  // ── Phase 2: SCORE ALL PRODUCTS ──────────────────────────────
  const scored = PRICE_INDEX.map(entry => {
    const { score, reasons } = scoreProduct(entry, qToks);
    let finalScore = score;
    if (matchedUseCase) {
      if (entry.useCase.includes(matchedUseCase) || matchedUseCase.includes(entry.useCase)) {
        finalScore += 8; reasons.push('USE_CASE_MATCH(+8)');
      } else {
        finalScore -= 5; reasons.push('USE_CASE_MISMATCH(-5)');
      }
    }
    if (qToks.some(qt => entry.catTokens.some(ct => ct.includes(qt) || qt.includes(ct)))) {
      finalScore += 3; reasons.push('CAT_MATCH(+3)');
    }
    if (qToks.some(qt => entry.qualTokens.some(qlt => qlt.includes(qt) || qt.includes(qlt)))) {
      finalScore += 2; reasons.push('QUALITY_MATCH(+2)');
    }
    return { entry, score: finalScore, reasons };
  }).filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score);

  scored.slice(0,5).forEach((x,i) => {
    console.log(`[BP Search] #${i+1} "${x.entry.p.n}" | score=${x.score.toFixed(2)} | ${x.reasons.join(' | ')}`);
  });

  const topScore    = scored[0]?.score ?? 0;
  const results = scored.filter(x => {
    if (x.score < topScore * 0.72 || x.score <= 0) return false;
    if (qToks.length < 2) return true;
    const nameHit = qToks.some(qt => x.entry.nameTokens.some(nt => tokenSim(qt, nt) >= SIM_THRESHOLD));
    return nameHit;
  }).slice(0,8).map(x=>x.entry.p);
  const suggestions = scored.slice(0,3).map(x=>x.entry.p);
  const confidence  = topScore >= 4 ? 'high' : topScore >= 1.5 ? 'low' : 'none';

  console.log(`[BP Search] confidence=${confidence} topScore=${topScore.toFixed(2)} results=${results.length}`);
  return { results, suggestions, confidence };
}

function isPriceQuery(text) {
  return /\bprice\b|\bprices\b|\brate\b|\brates\b|\bcost\b|\bkitna\b|\bhow much\b|₹|\brs\.?\s*\d|\brupee|\bdaam\b|\bpaisa\b|\bkya rate\b|\bkya price\b|\bprice list\b|\brate list\b|\bprice bata|\brate bata|\bprice btao|\brate btao|\bprice dena|\brate dena|\bprice chahiye|\brate chahiye|\bprice kya|\brate kya|\bquote\b|\bquotation\b/i.test(text);
}

// MISSED QUERY LOGGER
// ════════════════════════════════════════════════════════════
let missedQueries = JSON.parse(localStorage.getItem('bp_missed')||'[]');

function logMissed(query) {
  const q = query.trim().toLowerCase();
  const existing = missedQueries.find(m=>m.q===q);
  if(existing) { existing.count++; existing.last=new Date().toISOString(); }
  else missedQueries.push({q:query.trim(), count:1, last:new Date().toISOString()});
  localStorage.setItem('bp_missed', JSON.stringify(missedQueries));
}

function toggleAdmin() {
  const p = document.getElementById('adminPanel');
  if(p.style.display==='block'){p.style.display='none';return;}
  renderAdmin(); p.style.display='block';
}

function renderAdmin() {
  const list = document.getElementById('missedList');
  if(!missedQueries.length){list.innerHTML='<div class="empty-msg">No missed queries yet ✅</div>';return;}
  const sorted = [...missedQueries].sort((a,b)=>b.count-a.count);
  list.innerHTML = sorted.map(m=>`
    <div class="query-item">
      <div>${m.q}</div>
      <div class="query-count">Asked ${m.count}x · ${new Date(m.last).toLocaleDateString('en-IN')}</div>
    </div>`).join('');
}

function clearMissed() {
  missedQueries=[];localStorage.removeItem('bp_missed');
  renderAdmin();
}

const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');

function scrollDown() { setTimeout(()=>document.getElementById('msgEnd').scrollIntoView({behavior:'smooth'}),60); }

function addMsg(html,role) {
  const wrap=document.createElement('div'); wrap.className=`msg ${role}`;
  if(role==='bot') {
    wrap.innerHTML=`<div class="avatar">B</div><div class="bubble">${html}</div>`;
  } else {
    wrap.innerHTML=`<div class="bubble">${html}</div>`;
  }
  msgsEl.insertBefore(wrap,document.getElementById('msgEnd'));
  scrollDown();
}

function addChips(arr) {
  const old=document.getElementById('chips'); if(old) old.remove();
  const wrap=document.createElement('div'); wrap.className='chips-wrap'; wrap.id='chips';
  arr.forEach(label=>{
    const c=document.createElement('button'); c.className='chip'; c.textContent=label;
    c.onclick=()=>chipClick(label); wrap.appendChild(c);
  });
  msgsEl.insertBefore(wrap,document.getElementById('msgEnd'));
  scrollDown();
}

function showTyping() {
  const d=document.createElement('div'); d.className='msg bot'; d.id='typing-indicator';
  d.innerHTML=`<div class="avatar">B</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  msgsEl.insertBefore(d,document.getElementById('msgEnd')); scrollDown();
}
function hideTyping() { const t=document.getElementById('typing-indicator'); if(t) t.remove(); }

function botReply(html,chips) {
  showTyping();
  setTimeout(()=>{ hideTyping(); addMsg(html,'bot'); if(chips) addChips(chips); },650);
}

function chipClick(label) {
  addMsg(label,'user');
  const ans=findAnswer(label);
  if(ans) botReply(ans,MAIN_CHIPS);
  else {
    logMissed(label);
    botReply(`Sir, is baare mein thodi aur detail chahiye. Hamari Bharat Paints team WhatsApp par turant guide karegi.<br><br><a class="wa-btn" href="${WA_MSG}&text=${encodeURIComponent('Hi Bharat Paints! I need help with: '+label)}" target="_blank">💬 WhatsApp par poochho 👊</a>`,MAIN_CHIPS);
  }
}

function handleSend() {
  const txt=inputEl.value.trim(); if(!txt) return;
  inputEl.value=''; addMsg(txt,'user');
  const ans=findAnswer(txt);
  if(ans) botReply(ans,MAIN_CHIPS);
  else {
    logMissed(txt);
    botReply(`Sir, "<em>${txt}</em>" — yeh query thodi specific hai. Ek photo ya detail WhatsApp karo, main personally guide karunga.<br><br><a class="wa-btn" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Hi Bharat Paints! I need help with: '+txt)}" target="_blank">💬 WhatsApp karo — turant jawab milega 👊</a>`,MAIN_CHIPS);
  }
}

inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter') handleSend(); });

const SHEET_CSV_URL = ''; // ← PASTE YOUR GOOGLE SHEET CSV URL HERE

function parseSheetCSV(csvText) {
  const lines = csvText.trim().split('\n');
  if (lines.length < 2) return [];
  // Skip header row (row 0), parse data rows
  const products = [];
  for (let i = 1; i < lines.length; i++) {
    // Handle quoted fields with commas inside
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of lines[i]) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    // cols: [0]Category [1]Brand [2]Product Name [3]Pack Size [4]MRP [5]Offer Price [6]Stock
    if (cols.length < 6) continue;
    const productName = (cols[2] + ' ' + cols[3]).trim().toUpperCase();
    const mrpVal  = parseFloat(cols[4]);
    const opVal   = parseFloat(cols[5]);
    const inStock = (cols[6] || '').toLowerCase() !== 'out of stock';
    if (!productName || isNaN(opVal)) continue;
    if (!inStock) continue; // skip out-of-stock items
    products.push({
      n:   productName,
      mrp: isNaN(mrpVal) ? null : mrpVal,
      op:  opVal,
      src: 'sheet'  // tag so we know it came from the sheet
    });
  }
  return products;
}

function loadSheetPrices() {
  if (!SHEET_CSV_URL) {
    // No URL configured — build index from hardcoded PRICES only, SHEET_PRICES stays empty
    SHEET_STATUS = 'no_url';
    console.log('[BP Sheet] No sheet URL configured — using hardcoded prices only.');
    buildPriceIndex();
    return;
  }
  fetch(SHEET_CSV_URL)
    .then(r => {
      if (!r.ok) throw new Error('Sheet fetch failed: ' + r.status);
      return r.text();
    })
    .then(csv => {
      const sheetProducts = parseSheetCSV(csv);
      if (sheetProducts.length === 0) throw new Error('Sheet returned no products');
      // Populate SHEET_PRICES — PRICES array is NEVER modified
      SHEET_PRICES.length = 0;
      sheetProducts.forEach(p => SHEET_PRICES.push(p));
      SHEET_STATUS = 'loaded';
      console.log('[BP Sheet] Loaded ' + SHEET_PRICES.length + ' products into SHEET_PRICES. PRICES hardcoded: ' + PRICES.length);
      buildPriceIndex(); // rebuilds index: SHEET_PRICES first, then PRICES fallback
    })
    .catch(err => {
      // Sheet failed — SHEET_PRICES stays empty, PRICES used as-is, no crash
      SHEET_PRICES.length = 0;
      SHEET_STATUS = 'failed';
      console.warn('[BP Sheet] Sheet unavailable — falling back to hardcoded PRICES. Reason:', err.message);
      buildPriceIndex();
    });
}
